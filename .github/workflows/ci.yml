# db-connector-app (DB Connector): build e testes em todo push e PR; executáveis de cada sistema e o instalador do
# Windows (MSI); na master, assinatura pela SignPath Foundation (quando os secrets existem: primeiro o .exe, que entra no
# MSI, depois o MSI) e release. Nada de uma organização vai no build: as conexões são cadastradas (ou importadas) no
# próprio aplicativo.
name: ci

on:
  pull_request:
  push:
    branches: [dev, qa, master]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VERSAO: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DbConnector.slnx
      - run: dotnet build DbConnector.slnx --no-restore -c Release
      - run: dotnet test DbConnector.slnx --no-build -c Release

  # Um executável por sistema, com o runtime dentro, sem configuração. O do Windows sai num runner Windows: só lá o SDK
  # grava o ícone e a versão no .exe.
  publicar:
    needs: [build]
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publica
        shell: bash
        run: |
          opcoes="-c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true -p:SelfContained=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$VERSAO"
          dotnet publish src/DbConnector.Desktop/DbConnector.Desktop.csproj $opcoes -o out
          mkdir dist
          if [ "${{ matrix.rid }}" = win-x64 ]; then
            cp out/db-connector.exe dist/db-connector-windows-x64.exe
          else
            dotnet publish src/DbConnector.Cli/DbConnector.Cli.csproj $opcoes -o out-cli
            cp out/db-connector out-cli/db-connector-cli dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  # Assinatura Authenticode pela SignPath Foundation (certificado para projetos open source): o pedido leva um artefato
  # deste build; a SignPath confere de onde ele veio (repositório, branch, commit, workflow) e devolve o arquivo
  # assinado. Sem o secret SIGNPATH_API_TOKEN, segue sem assinatura (aviso no log).
  assinar-exe:
    needs: [publicar]
    if: github.ref_name == 'master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      assinado: ${{ steps.segredo.outputs.tem }}
    steps:
      - id: segredo
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: echo "tem=$([ -n "$TOKEN" ] && echo sim || echo nao)" >> "$GITHUB_OUTPUT"
      - if: steps.segredo.outputs.tem != 'sim'
        run: echo "::warning::sem SIGNPATH_API_TOKEN, o executável e o instalador vão sem assinatura"
      - id: artefato
        if: steps.segredo.outputs.tem == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="win-x64") | .id')" >> "$GITHUB_OUTPUT"
      - uses: signpath/github-action-submit-signing-request@v1
        if: steps.segredo.outputs.tem == 'sim'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: db-connector-app
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows
          github-artifact-id: ${{ steps.artefato.outputs.id }}
          wait-for-completion: true
          output-artifact-directory: assinado
      - uses: actions/upload-artifact@v4
        if: steps.segredo.outputs.tem == 'sim'
        with:
          name: win-x64-assinado
          path: assinado/
          if-no-files-found: error

  # Instalador MSI (WiX 5) com o .exe (assinado, quando houver).
  instalador:
    needs: [publicar, assinar-exe]
    if: always() && needs.publicar.result == 'success' && needs.assinar-exe.result != 'failure'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.assinar-exe.outputs.assinado == 'sim' && 'win-x64-assinado' || 'win-x64' }}
          path: exe
      - name: Monta o MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          ./instalador/montar.ps1 -Exe exe/db-connector-windows-x64.exe -Versao $env:VERSAO -Saida msi
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: msi/db-connector-windows-x64.msi
          if-no-files-found: error

  assinar-msi:
    needs: [instalador, assinar-exe]
    if: needs.assinar-exe.outputs.assinado == 'sim'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - id: artefato
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="instalador") | .id')" >> "$GITHUB_OUTPUT"
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: db-connector-app
          signing-policy-slug: release-signing
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.artefato.outputs.id }}
          wait-for-completion: true
          output-artifact-directory: assinado
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-assinado
          path: assinado/
          if-no-files-found: error

  release:
    needs: [publicar, assinar-exe, instalador, assinar-msi]
    if: always() && github.ref_name == 'master' && github.event_name == 'push' && needs.instalador.result == 'success' && needs.assinar-msi.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - name: Junta o instalador, o executável e os pacotes de Linux e macOS
        run: |
          mkdir dist
          if [ -d artefatos/instalador-assinado ]; then cp artefatos/instalador-assinado/* dist/; else cp artefatos/instalador/* dist/; fi
          if [ -d artefatos/win-x64-assinado ]; then cp artefatos/win-x64-assinado/* dist/; else cp artefatos/win-x64/* dist/; fi
          for rid in linux-x64 osx-arm64; do
            nome=$([ $rid = linux-x64 ] && echo db-connector-linux-x64 || echo db-connector-macos-arm64)
            mkdir -p "pacote/$nome" && cp artefatos/$rid/* "pacote/$nome/"
            chmod +x "pacote/$nome/db-connector" "pacote/$nome/db-connector-cli"
            tar -C pacote -czf "dist/$nome.tar.gz" "$nome"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSAO" dist/* --repo "$GITHUB_REPOSITORY" --title "DB Connector v$VERSAO" --latest \
            --notes "DB Connector: proxy local de SSO (OIDC) para bancos PostgreSQL, para usar com DBeaver e outros aplicativos SQL. Windows: instale pelo db-connector-windows-x64.msi. Linux e macOS: extraia o .tar.gz. As conexões são cadastradas (ou importadas) no aplicativo. Confira o SHA256SUMS. Code signing policy: https://github.com/${GITHUB_REPOSITORY}#code-signing-policy"
