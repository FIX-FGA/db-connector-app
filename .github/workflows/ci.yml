# db-connector-app (FIX bancos): build e testes em todo push e PR; executáveis de cada sistema como artefato; na master, o executável do
# Windows é assinado pela SignPath Foundation (quando os secrets existem) e tudo vai para uma release.
name: ci

on:
  pull_request:
  push:
    branches: [dev, qa, master]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fix.Bancos.slnx
      - run: dotnet build Fix.Bancos.slnx --no-restore -c Release
      - run: dotnet test Fix.Bancos.slnx --no-build -c Release

  # Um executável por sistema, com o runtime dentro. O do Windows sai num runner Windows: só lá o SDK grava o ícone e
  # a versão no .exe.
  publicar:
    needs: [build]
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, nome: fix-bancos-windows-x64.exe, origem: fix-bancos.exe }
          - { os: ubuntu-latest, rid: linux-x64, nome: fix-bancos-linux-x64, origem: fix-bancos }
          - { os: ubuntu-latest, rid: osx-arm64, nome: fix-bancos-macos-arm64, origem: fix-bancos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publica o aplicativo
        shell: bash
        run: |
          dotnet publish src/Fix.Bancos.Desktop/Fix.Bancos.Desktop.csproj -c Release -r ${{ matrix.rid }} -o out \
            -p:PublishSingleFile=true -p:SelfContained=true -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            -p:Version=1.0.${{ github.run_number }}
          mkdir dist
          cp "out/${{ matrix.origem }}" "dist/${{ matrix.nome }}"
      - name: Publica a linha de comando (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          dotnet publish src/Fix.Bancos.Cli/Fix.Bancos.Cli.csproj -c Release -r linux-x64 -o out-cli \
            -p:PublishSingleFile=true -p:SelfContained=true -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            -p:Version=1.0.${{ github.run_number }}
          cp out-cli/fix-bancos-cli dist/fix-bancos-cli-linux-x64
      - uses: actions/upload-artifact@v4
        id: artefato
        with:
          name: ${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  # Assinatura Authenticode do .exe pela SignPath Foundation (certificado para projetos open source). O pedido leva o
  # artefato win-x64 deste mesmo build; a SignPath confere de onde ele veio (repositório, branch, commit, workflow) e
  # devolve o executável assinado. Sem o secret SIGNPATH_API_TOKEN, a release sai sem assinatura.
  assinar:
    needs: [publicar]
    if: github.ref_name == 'master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - id: segredo
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: echo "tem=$([ -n "$TOKEN" ] && echo sim || echo nao)" >> "$GITHUB_OUTPUT"
      - name: Sem SignPath
        if: steps.segredo.outputs.tem != 'sim'
        run: echo "::warning::sem SIGNPATH_API_TOKEN, o fix-bancos-windows-x64.exe vai sem assinatura"
      - name: Id do artefato win-x64
        if: steps.segredo.outputs.tem == 'sim'
        id: artefato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="win-x64") | .id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: signpath/github-action-submit-signing-request@v1
        if: steps.segredo.outputs.tem == 'sim'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: db-connector-app
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows
          github-artifact-id: ${{ steps.artefato.outputs.id }}
          wait-for-completion: true
          output-artifact-directory: assinado
      - uses: actions/upload-artifact@v4
        if: steps.segredo.outputs.tem == 'sim'
        with:
          name: win-x64-assinado
          path: assinado/
          if-no-files-found: error

  release:
    needs: [publicar, assinar]
    if: github.ref_name == 'master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - name: Junta os executáveis (o do Windows assinado, quando houver)
        run: |
          mkdir dist
          cp artefatos/linux-x64/* artefatos/osx-arm64/* dist/
          if [ -d artefatos/win-x64-assinado ]; then cp artefatos/win-x64-assinado/* dist/; else cp artefatos/win-x64/* dist/; fi
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$versao" dist/* --repo "$GITHUB_REPOSITORY" --title "FIX bancos $versao" --latest \
            --notes "FIX bancos: acesso aos bancos do FIX pelo DBeaver com o login no navegador. Windows: fix-bancos-windows-x64.exe. Confira o SHA256SUMS."
